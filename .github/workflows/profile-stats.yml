name: Update profile statistics

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate SVG dashboards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node .github/scripts/generate-profile-stats.mjs
      - name: Commit updated dashboards
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(profile): update GitHub statistics'
          file_pattern: 'assets/profile-stats.svg assets/project-stats.svg'
