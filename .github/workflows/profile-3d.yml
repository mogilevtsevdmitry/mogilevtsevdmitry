name: Update GitHub Skyline

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install fallback tools
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu-core

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install capture dependencies
        run: npm install puppeteer@24.20.0 --no-fund --no-audit

      - name: Create assets directory
        run: mkdir -p assets

      - name: Take screenshot with reliable capture
        run: |
          node <<"EOF"
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const { execSync } = require('child_process');

          async function captureSkyline() {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--enable-webgl',
                '--window-size=1400,800'
              ],
              timeout: 180000
            });

            try {
              const page = await browser.newPage();
              await page.setDefaultNavigationTimeout(180000);
              
              const owner = process.env.GITHUB_REPOSITORY_OWNER;
              console.log(`Trying official Skyline for ${owner}...`);
              const success = await tryCapture(page, `https://git-skyline.huakun.tech/contribution/github/${owner}/embed?enableZoom=false&autoRotate=false`);
              
              return success;
            } finally {
              await browser.close();
            }
          }

          async function tryCapture(page, url) {
            try {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
              await page.waitForSelector('canvas', { visible: true, timeout: 60000 });
              await new Promise(resolve => setTimeout(resolve, 30000));
              await page.screenshot({ path: 'assets/skyline.png' });
              return true;
            } catch (error) {
              console.log(`Failed to capture from ${url}:`, error.message);
              return false;
            }
          }

          // Main execution
          (async () => {
            if (!await captureSkyline()) {
              console.log('Generating fallback image...');
              execSync(`
                convert -size 1400x800 xc:#0d1117 \
                  -fill white -font DejaVu-Sans -pointsize 40 -gravity center \
                  -annotate +0+0 "GitHub Skyline\\nService Temporarily Down\\nLast try: $(date +'%Y-%m-%d %H:%M')" \
                  assets/skyline.png
              `);
            }
          })();
          EOF

      - name: Verify result
        run: |
          ls -la assets/
          [ -s assets/skyline.png ] || exit 1
          file assets/skyline.png

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Skyline view"
          file_pattern: "assets/skyline.png"
